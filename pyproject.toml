[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "apprt"
version         = "1.0.0"
description     = "Advanced Port Inspector CLI — list open ports and per-port activity"
readme          = "README.md"
requires-python = ">=3.9"
license         = { text = "MIT" }

dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "psutil>=5.9",
]

[project.scripts]
apprt = "apprt.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["apprt*"]
